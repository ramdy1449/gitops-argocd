# =============================================================================
# CERT-MANAGER CONFIGURATION - Dev/Minikube
# =============================================================================
# Strategy: Self-Signed CA → Wildcard Certificate
# This creates a local CA and uses it to sign certificates
# =============================================================================

---
# =============================================================================
# Step 1: Self-Signed Issuer (creates the CA)
# =============================================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}

---
# =============================================================================
# Step 2: CA Certificate (root certificate for signing)
# =============================================================================
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: localtest-me-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: localtest.me-ca
  subject:
    organizations:
      - "Dev Environment"
    organizationalUnits:
      - "Platform Team"
  secretName: localtest-me-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  duration: 87600h    # 10 years
  renewBefore: 8760h  # 1 year

---
# =============================================================================
# Step 3: CA Issuer (uses the CA to sign certificates)
# =============================================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: localtest-me-ca-issuer
spec:
  ca:
    secretName: localtest-me-ca-secret

---
# =============================================================================
# Step 4: Wildcard Certificate for *.localtest.me
# =============================================================================
# Certificate created in kube-system (where Traefik is deployed)
# TLSStore references this as the default certificate
# =============================================================================
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-localtest-me
  namespace: kube-system
spec:
  secretName: wildcard-localtest-me-tls
  commonName: "*.localtest.me"
  dnsNames:
    - "*.localtest.me"
    - "localtest.me"
  issuerRef:
    name: localtest-me-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  duration: 8760h     # 1 year
  renewBefore: 720h   # 30 days
  privateKey:
    algorithm: RSA
    size: 2048