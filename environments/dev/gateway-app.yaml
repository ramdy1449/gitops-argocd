apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: dev-project
  source:
    repoURL: https://ramdy1449.github.io/helm-charts
    chart: gateway
    targetRevision: 0.2.11
    helm:
      values: |
        storage:
          storageClass: nfs-client
        
        public:
          gatewayUrl: "https://gateway.localtest.me"
          expenseUrl: "https://expense.localtest.me"
          chatUrl: "https://chat.localtest.me"
          bankUrl: "https://bank.localtest.me"
        
        ingress:
          enabled: true
          host: "gateway.localtest.me"
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true