# =============================================================================
# METALLB - Load Balancer for Bare-Metal/Minikube
# =============================================================================
# Sync Wave: -4 (deploys FIRST - before everything)
# Provides External IPs for LoadBalancer services
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: dev-project
  source:
    repoURL: https://metallb.github.io/metallb
    chart: metallb
    targetRevision: 0.14.3
    helm:
      values: |
        controller:
          enabled: true
          logLevel: info
        speaker:
          enabled: true
          logLevel: info
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
---
# =============================================================================
# METALLB IP ADDRESS POOL - Dev/Minikube
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: dev-project
  source:
    repoURL: https://github.com/ramdy1449/gitops-argocd.git
    targetRevision: main
    path: environments/dev/metallb-config
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true