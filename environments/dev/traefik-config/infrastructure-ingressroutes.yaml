# =============================================================================
# TRAEFIK INGRESSROUTES - Infrastructure Services
# =============================================================================
# ArgoCD and Longhorn IngressRoutes with TLS
# Uses default certificate from TLSStore
# =============================================================================

---
# =============================================================================
# ARGOCD - IngressRoute
# =============================================================================
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
  labels:
    app: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.localtest.me`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
  tls: {}

---
# =============================================================================
# LONGHORN UI - IngressRoute
# =============================================================================
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn-ui
  namespace: longhorn-system
  labels:
    app: longhorn
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`longhorn.localtest.me`)
      kind: Rule
      services:
        - name: longhorn-frontend
          port: 80
  tls: {}